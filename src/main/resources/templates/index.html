<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Author Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        .author-details {
            margin-top: 20px;
        }
        .author-details p {
            margin: 5px 0;
        }
        .delete-button {
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            cursor: pointer;
        }
        .delete-button:hover {
            background-color: #cc0000;
        }
        .input-field {
            margin-bottom: 10px;
        }
        .input-field label {
            display: inline-block;
            width: 100px;
            text-align: right;
            margin-right: 10px;
        }
        .input-field input {
            padding: 5px;
        }
    </style>
</head>
<body>
<h1>Author Management</h1>

<!-- Форма для ввода идентификатора автора -->
<form id="authorForm">
    <div class="input-field">
        <label for="authorId">Author ID:</label>
        <input type="text" id="authorId" name="authorId" placeholder="Enter author ID" required>
    </div>
    <button type="submit">Get Author Details</button>
</form>

<!-- Блок для отображения деталей автора -->
<div class="author-details" style="display: none;">
    <p><strong>ID:</strong> <span id="authorIdDisplay"></span></p>
    <p><strong>Name:</strong> <span id="authorName"></span></p>
    <p><strong>Email:</strong> <span id="authorEmail"></span></p>
    <button class="delete-button" onclick="deleteAuthor()">Delete Author</button>
</div>

<script>
    document.getElementById('authorForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const authorId = document.getElementById('authorId').value;

        // Делаем запрос к API для получения автора по ID
        fetch(`/authors/${authorId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('authorIdDisplay').textContent = data.id;
                document.getElementById('authorName').textContent = data.name;
                document.getElementById('authorEmail').textContent = data.email;
                document.querySelector('.author-details').style.display = 'block';
            })
            .catch(error => console.error('Error:', error));
    });

    // Функция для удаления автора
    function deleteAuthor() {
        const authorId = document.getElementById('authorIdDisplay').textContent;
        if (confirm("Are you sure you want to delete this author?")) {
            fetch(`/authors/${authorId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data) {
                    alert("Author deleted successfully");
                    document.querySelector('.author-details').style.display = 'none';
                } else {
                    alert("Failed to delete author");
                }
            })
            .catch(error => console.error('Error:', error));
        }
    }
</script>
</body>
</html>
